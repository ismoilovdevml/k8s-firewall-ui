# Sample multi-team application for end-to-end tests and screenshots.
# Mirrors the built-in --demo cluster (internal/demo). Every container is
# busybox serving HTTP on its declared ports, so connectivity can be probed
# with wget from any pod. Apply: kubectl apply -f hack/e2e/workloads.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    team: "storefront"
---
apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    team: "payments"
    pci: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: analytics
  labels:
    team: "data"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingress-nginx-controller
  namespace: ingress-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-nginx
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c", "echo ok > /tmp/index.html; httpd -f -p 80 -h /tmp"]
          ports:
            - name: http
              containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c", "echo ok > /tmp/index.html; httpd -f -p 9090 -h /tmp"]
          ports:
            - name: web
              containerPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
      tier: web
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c", "echo ok > /tmp/index.html; httpd -f -p 8080 -h /tmp & httpd -f -p 9100 -h /tmp; wait"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cart
      tier: api
  template:
