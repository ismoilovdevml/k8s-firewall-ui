{{- if and (eq .Values.auth.mode "token") (not .Values.auth.existingSecret) }}
{{- $name := include "k8s-firewall-ui.sessionSecretName" . }}
{{- $secret := .Values.auth.sessionSecret }}
{{- if not $secret }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- $secret = index $existing.data .Values.auth.existingSecretKey | b64dec }}
{{- else }}
{{- $secret = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "k8s-firewall-ui.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.auth.existingSecretKey }}: {{ $secret | b64enc | quote }}
{{- end }}
