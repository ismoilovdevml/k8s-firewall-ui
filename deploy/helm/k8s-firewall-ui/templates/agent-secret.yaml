{{- if and .Values.flows.enabled (not .Values.flows.existingSecret) }}
{{- $name := include "k8s-firewall-ui.agentSecretName" . }}
{{- $token := .Values.flows.agentToken }}
{{- if not $token }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if $existing }}
{{- $token = index $existing.data .Values.flows.existingSecretKey | b64dec }}
{{- else }}
{{- $token = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "k8s-firewall-ui.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.flows.existingSecretKey }}: {{ $token | b64enc | quote }}
{{- end }}
