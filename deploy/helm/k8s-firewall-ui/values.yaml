image:
  repository: ghcr.io/ismoilovdevml/k8s-firewall-ui
  tag: ""            # defaults to the chart appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Run without create/update/delete permissions — safe for evaluation.
readOnly: false

# Skip CNI auto-detection and trust this provider name (e.g. "calico").
cniOverride: ""

auth:
  # none  — no login; the ServiceAccount makes every change. Only for
  #         trusted, private access (port-forward).
  # token — users sign in with their own Kubernetes bearer token
  #         (ServiceAccount token or OIDC id_token). Kubernetes RBAC
  #         decides what each user may change; the ServiceAccount gets no
  #         write permissions at all.
  # proxy — an authenticating proxy (oauth2-proxy, Pomerium, …) passes
  #         the user in headers; writes impersonate that user. The
  #         ServiceAccount gets impersonation rights instead of writes.
  #         Make sure ONLY the proxy can reach the pod (see networkPolicy).
  mode: none
  # token/proxy only: each user sees only namespaces where their RBAC lets
  # them list NetworkPolicies (multi-tenant clusters). Verdicts are still
  # computed over the whole cluster.
  restrictReads: false
  sessionTTL: 8h
  # Session cookie encryption secret (token mode). Leave empty to generate
  # one that persists across upgrades, or reference your own Secret.
  sessionSecret: ""
  existingSecret: ""
  existingSecretKey: session-secret
  proxy:
    userHeader: X-Forwarded-User
    groupsHeader: X-Forwarded-Groups
  # Mark cookies Secure. Enable whenever users reach the UI over HTTPS
  # (e.g. TLS terminated at the ingress).
  secureCookies: false

# Serve HTTPS directly from the pod using a kubernetes.io/tls Secret.
tls:
  enabled: false
  secretName: ""

logging:
  format: json      # json | text
  level: info       # debug | info | warn | error

audit:
  # Entries kept in memory for the UI's audit page. The durable audit
  # record is the structured log stream (every entry has audit=true).
  bufferSize: 1000

# Post every policy change made through the UI to a webhook. The URL of a
# Slack/Teams incoming webhook is a credential: keep it in a Secret.
notifications:
  enabled: false
  format: slack        # slack (text) | json (full audit entry, e.g. for a SIEM)
  existingSecret: ""   # Secret holding the URL
  existingSecretKey: webhook-url

metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

replicaCount: 1

podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Dogfooding: restrict traffic to the UI pod itself.
# Observed traffic ("learning mode"): a DaemonSet agent reads each node's
# conntrack table and reports the connections pods actually make. The UI
# shows them per workload and can build least-privilege policies from them.
# Works with iptables/nftables data paths (kube-router, Calico iptables,
# flannel, Cilium with kube-proxy, AWS VPC CNI, …); eBPF-only data paths
# without conntrack show nothing. The agent runs with hostNetwork and
# CAP_NET_ADMIN.
flows:
  enabled: false
  # How long an observed flow is kept (in memory on the server).
  retention: 24h
  # Shared agent → server token. Leave empty to generate one that persists
  # across upgrades, or reference your own Secret.
  agentToken: ""
  existingSecret: ""
  existingSecretKey: agent-token
  agent:
    interval: 10s
    # Defaults to the in-cluster Service URL.
    serverURL: ""
    # tls.enabled: key of tls.secretName holding the certificate the agent
    # trusts (tls.crt for self-signed, ca.crt if your issuer adds one).
    caKey: tls.crt
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
    nodeSelector: {}
    # Run on every node, including control-plane nodes.
    tolerations:
      - operator: Exists
    priorityClassName: ""

networkPolicy:
  enabled: false
  # Peers allowed to reach the UI. Empty = any source in the cluster.
  # For auth.mode=proxy, set this to select only the proxy pods.
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ingress-nginx
  # flows.enabled with ingressFrom set: node CIDRs the agents (hostNetwork)
  # connect from. Traffic from the pod's own node is always allowed.
  agentCIDRs: []
  # CIDR(s) of the Kubernetes API server for the egress allow rule.
  apiServerCIDRs:
    - 0.0.0.0/0
  apiServerPorts: [443, 6443]
  # Additional egress rules, e.g. to reach a notification webhook:
  #   - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
  #     ports: [{protocol: TCP, port: 443}]
  extraEgress: []

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # Server-Sent Events need buffering off on ingress-nginx:
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  hosts:
    - host: firewall-ui.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

extraArgs: []
extraEnv: []

podAnnotations: {}
podLabels: {}
priorityClassName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
