name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./... -race -cover
      - name: Vet
        run: go vet ./... && go vet -tags e2e ./test/e2e/
      - name: Lint the sample policies with our own linter
        run: go run ./cmd/k8s-firewall-ui lint --format github --fail-on critical hack/e2e/
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: k8s-firewall-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/k8s-firewall-ui
      - run: helm template test deploy/helm/k8s-firewall-ui > /dev/null
      - run: helm template test deploy/helm/k8s-firewall-ui --set readOnly=true > /dev/null
      - run: helm template test deploy/helm/k8s-firewall-ui --set auth.mode=token --set auth.restrictReads=true > /dev/null
      - run: helm template test deploy/helm/k8s-firewall-ui --set auth.mode=proxy --set networkPolicy.enabled=true > /dev/null
      - run: helm template test deploy/helm/k8s-firewall-ui --set flows.enabled=true --set tls.enabled=true --set tls.secretName=tls --set networkPolicy.enabled=true > /dev/null
      - run: >-
          helm template test deploy/helm/k8s-firewall-ui --set tls.enabled=true --set tls.secretName=tls
          --set metrics.serviceMonitor.enabled=true --set podDisruptionBudget.enabled=true
          --set replicaCount=2 --set ingress.enabled=true
          --set notifications.enabled=true --set notifications.existingSecret=hook > /dev/null

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        run: make build
      - name: Run demo server and probe the API
        run: |
          ./bin/k8s-firewall-ui --demo --listen :8080 &
          for i in $(seq 1 30); do curl -sf localhost:8080/readyz && break; sleep 1; done
          curl -sf localhost:8080/api/v1/posture | grep -q '"score"'
          curl -sf localhost:8080/ | grep -q '<div id="root">'
          curl -sf localhost:8080/metrics | grep -q fwui_posture_score
          curl -sf 'localhost:8080/api/v1/flows?namespace=shop&workload=deployment/frontend' | grep -q '"allowedNow":true'
          # writes without the CSRF header are rejected
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/v1/simulate -d '{}')" = 403

  e2e:
    # Real cluster: k3s enforces NetworkPolicy with its embedded kube-router.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Start k3s
        run: |
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.33.4+k3s1 \
            INSTALL_K3S_EXEC="--disable=traefik --disable=metrics-server --write-kubeconfig-mode=644" sh -
          # GITHUB_ENV applies to later steps only; export for this one too.
          export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do kubectl get nodes 2>/dev/null | grep -q " Ready" && break; sleep 2; done
          for i in $(seq 1 60); do kubectl -n kube-system get pod -l k8s-app=kube-dns -o name 2>/dev/null | grep -q pod && break; sleep 2; done
          kubectl -n kube-system wait --for=condition=Ready pod -l k8s-app=kube-dns --timeout=180s
      - name: Install Playwright
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run end-to-end suite
        run: hack/e2e/run.sh
        env:
          AGENT_SUDO: sudo
      - name: Upload videos, screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            web/e2e-results
            web/e2e-report
            e2e-server.log
            e2e-agent.log
          retention-days: 14
